<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 212" width="720" height="191" fill="none">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="800" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#131922"/>
      <stop offset="100%" stop-color="#0B0F15"/>
    </linearGradient>
    <linearGradient id="tileBg" x1="106" y1="32" x2="106" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18202B"/>
      <stop offset="100%" stop-color="#0D1219"/>
    </linearGradient>
    <linearGradient id="bLeftWing" x1="220" y1="240" x2="512" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="bRightWing" x1="794" y1="240" x2="512" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Architectural Banner Card -->
  <rect x="1.5" y="1.5" width="797" height="209" rx="22" fill="url(#cardBg)" stroke="#253040" stroke-width="2"/>

  <!-- Subtle Blueprint Grid Lines -->
  <g stroke="#171F2A" stroke-width="1">
    <line x1="206" y1="2" x2="206" y2="210"/>
    <line x1="460" y1="2" x2="460" y2="210"/>
    <line x1="714" y1="2" x2="714" y2="210"/>
    <line x1="2" y1="106" x2="798" y2="106"/>
  </g>

  <!-- Left: Visual IDE iOS Squircle AppIcon Tile (148x148 at x=32, y=32) -->
  <g transform="translate(32, 32) scale(0.14453125)">
    <!-- Squircle Background -->
    <rect width="1024" height="1024" rx="228" fill="url(#tileBg)"/>

    <!-- Blueprint Grid inside Tile -->
    <g stroke="#1A2433" stroke-width="2">
      <line x1="256" y1="0" x2="256" y2="1024"/><line x1="512" y1="0" x2="512" y2="1024"/><line x1="768" y1="0" x2="768" y2="1024"/>
      <line x1="0" y1="256" x2="1024" y2="256"/><line x1="0" y1="512" x2="1024" y2="512"/><line x1="0" y1="768" x2="1024" y2="768"/>
    </g>

    <!-- Emerald Gutter Rail -->
    <rect x="140" y="240" width="22" height="544" rx="11" fill="#10B981"/>

    <!-- V-Monogram Ribbon -->
    <path d="M 230 240 L 512 800" stroke="url(#bLeftWing)" stroke-width="84" stroke-linecap="round" stroke-linejoin="round" filter="url(#tileShadow)"/>
    <path d="M 794 240 L 512 800" stroke="url(#bRightWing)" stroke-width="84" stroke-linecap="round" stroke-linejoin="round" filter="url(#tileShadow)"/>
    <circle cx="512" cy="800" r="42" fill="#10B981"/>

    <!-- Inner Code Core: < / > -->
    <g filter="url(#tileShadow)">
      <path d="M 420 380 L 330 460 L 420 540" fill="none" stroke="#38BDF8" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="540" y1="360" x2="484" y2="560" stroke="#10B981" stroke-width="42" stroke-linecap="round"/>
      <path d="M 604 380 L 694 460 L 604 540" fill="none" stroke="#34D399" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Top-Right IDE Pill -->
    <g transform="translate(680, 150)">
      <rect width="180" height="48" rx="24" fill="#1E293B" stroke="#334155" stroke-width="3"/>
      <circle cx="28" cy="24" r="7" fill="#10B981"/>
      <text x="48" y="32" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" letter-spacing="1.5">IDE</text>
    </g>

    <rect x="6" y="6" width="1012" height="1012" rx="224" stroke="#303E52" stroke-width="12" fill="none"/>
  </g>

  <!-- Right: Single-Line Wordmark 'Visual IDE_' + Technical Tagline -->
  <g transform="translate(228, 42)">
    <!-- Wordmark text with emerald terminal underscore cursor -->
    <text x="4" y="90" fill="#F1F5F9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="84" font-weight="700" letter-spacing="-3">Visual IDE<tspan fill="#10B981">_</tspan></text>

    <!-- Subtitle Pill & Technical Tagline -->
    <rect x="4" y="116" width="6" height="6" rx="3" fill="#10B981"/>
    <text x="19" y="123" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1.4">NATIVE CODE EDITOR &amp; REMOTE WORKSTATION FOR IOS</text>
  </g>

  <!-- Corner Registration Marks -->
  <path d="M762 22 H776 V36 M762 190 H776 V176" stroke="#2D3A4B" stroke-width="2" stroke-linecap="square"/>
</svg>
