<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" fill="none">
  <defs>
    
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111722"/>
      <stop offset="50%" stop-color="#0B0F16"/>
      <stop offset="100%" stop-color="#070A0F"/>
    </linearGradient>

    <!-- Ambient Center Radial Glow -->
    <radialGradient id="centerGlow" cx="512" cy="512" r="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#10B981" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0B0F16" stop-opacity="0"/>
    </radialGradient>

    <!-- Left Wing Gradient: Electric Cyan to Azure -->
    <linearGradient id="leftWing" x1="220" y1="220" x2="512" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Right Wing Gradient: Emerald to Mint -->
    <linearGradient id="rightWing" x1="804" y1="220" x2="512" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Center Code Gradient -->
    <linearGradient id="codeGrad" x1="360" y1="360" x2="664" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Badge Background -->
    <linearGradient id="badgeBg" x1="380" y1="840" x2="644" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Shadow for Depth -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g>
    <!-- Background Canvas -->
    <rect width="1024" height="1024" fill="url(#bgGrad)"/>
    <circle cx="512" cy="512" r="480" fill="url(#centerGlow)"/>

    <!-- Technical Architectural Grid Lines -->
    <g stroke="#1A2433" stroke-width="2">
      <line x1="128" y1="0" x2="128" y2="1024"/><line x1="256" y1="0" x2="256" y2="1024"/>
      <line x1="384" y1="0" x2="384" y2="1024"/><line x1="512" y1="0" x2="512" y2="1024"/>
      <line x1="640" y1="0" x2="640" y2="1024"/><line x1="768" y1="0" x2="768" y2="1024"/>
      <line x1="896" y1="0" x2="896" y2="1024"/>
      <line x1="0" y1="128" x2="1024" y2="128"/><line x1="0" y1="256" x2="1024" y2="256"/>
      <line x1="0" y1="384" x2="1024" y2="384"/><line x1="0" y1="512" x2="1024" y2="512"/>
      <line x1="0" y1="640" x2="1024" y2="640"/><line x1="0" y1="768" x2="1024" y2="768"/>
      <line x1="0" y1="896" x2="1024" y2="896"/>
    </g>

    <!-- Corner Registration Marks -->
    <path d="M828 148 H868 V188 M828 876 H868 V836 M156 188 V148 H196 M156 836 V876 H196" stroke="#253346" stroke-width="5" stroke-linecap="square"/>

    <!-- Left Active Editor Gutter Accent -->
    <rect x="136" y="240" width="18" height="544" rx="9" fill="#10B981" opacity="0.85"/>

    <!-- MAIN EMBLEM: The Iconic 'Visual IDE' Monogram (V + Coding Core) -->
    <!-- Glow Backdrop for V -->
    <g opacity="0.4" filter="url(#neonGlow)">
      <path d="M 230 240 L 512 800 L 794 240" fill="none" stroke="#0284C7" stroke-width="84" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Left Wing of V (Electric Blue Ribbon with Bevel) -->
    <path d="M 230 240 L 512 800" stroke="url(#leftWing)" stroke-width="84" stroke-linecap="round" stroke-linejoin="round" filter="url(#dropShadow)"/>

    <!-- Right Wing of V (Emerald Ribbon, overlaps gracefully at vertex) -->
    <path d="M 794 240 L 512 800" stroke="url(#rightWing)" stroke-width="84" stroke-linecap="round" stroke-linejoin="round" filter="url(#dropShadow)"/>

    <!-- Overlap Joint Core Vertex -->
    <circle cx="512" cy="800" r="42" fill="#10B981"/>

    <!-- Inner Code Core: < / > Bracket Glyph floating harmoniously inside V -->
    <g filter="url(#dropShadow)">
      <!-- Left Chevron '<' -->
      <path d="M 420 380 L 330 460 L 420 540" fill="none" stroke="#38BDF8" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Forward Slash '/' -->
      <line x1="540" y1="360" x2="484" y2="560" stroke="#10B981" stroke-width="40" stroke-linecap="round"/>
      
      <!-- Right Chevron '>' -->
      <path d="M 604 380 L 694 460 L 604 540" fill="none" stroke="#34D399" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Terminal Prompt / Visual IDE Tagline Pill at Top-Right -->
    <g transform="translate(680, 150)">
      <rect width="180" height="48" rx="24" fill="#1E293B" stroke="#334155" stroke-width="3"/>
      <circle cx="28" cy="24" r="7" fill="#10B981"/>
      <text x="48" y="32" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" letter-spacing="1.5">IDE</text>
    </g>

    
  </g>
</svg>